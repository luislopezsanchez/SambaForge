name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: Go Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Download dependencies
        working-directory: apps/api
        run: go mod download
      - name: Vet
        working-directory: apps/api
        run: go vet ./...
      - name: Build
        working-directory: apps/api
        run: CGO_ENABLED=0 go build -ldflags "-s -w" -o /dev/null .
      - name: Test
        working-directory: apps/api
        run: go test -v ./...

  web:
    name: React Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Build
        working-directory: apps/web
        run: npm run build
      - name: Lint
        working-directory: apps/web
        run: npm run lint